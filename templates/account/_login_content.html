<p class="intro">
  Sign in with your verified Chico State Google account to publish reviews and
  upload images. Public browsing does not require an account.
</p>
<form method="post"{% if standalone %} action="{% url 'google_login' %}"{% else %} data-login-action="{% url 'google_login' %}"{% endif %} class="account-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next_url }}">
  <button type="submit">Continue with Google</button>
</form>
<p class="form-help">Only eligible <code>@csuchico.edu</code> identities can use actions.</p>
