{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Campus Cuisines{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/site.css' %}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="page-width">
        <a class="brand" href="{% url 'home' %}">Campus Cuisines</a>
        <nav class="site-nav" aria-label="Account">
          {% if user.is_authenticated %}
            <span class="site-nav__identity">{{ user.email }}</span>
            <form method="post" action="{% url 'account-logout' %}">
              {% csrf_token %}
              <button type="submit" class="site-nav__button">Sign out</button>
            </form>
          {% else %}
            <a href="{% url 'account-login' %}">Sign in</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main id="main-content" class="page-width">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
