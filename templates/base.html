{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Campus Cuisines{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/site.css' %}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="page-width">
        <div class="site-header__topline">
          <a class="brand" href="{% url 'home' %}">Campus Cuisines</a>
          <nav aria-label="Primary navigation">
            <ul class="primary-navigation">
              {% for item in navigation_items %}
                <li>
                  <a href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>
                </li>
              {% endfor %}
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <main id="main-content" class="page-width">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
