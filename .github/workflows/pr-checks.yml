name: Pull request checks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  foundation:
    name: Python quality and infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Verify infrastructure-owned files
        run: python scripts/verify_infrastructure.py
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright
      - name: Security lint
        run: bandit -q -r scripts tests
      - name: Audit Python dependencies
        run: pip-audit --local
      - name: Run available tests
        run: |
          if [ -f manage.py ]; then
            python manage.py check
            pytest --cov --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          else
            pytest tests/infrastructure
          fi
      - name: Upload coverage on failure
        if: failure() && hashFiles('reports/coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: reports/
          if-no-files-found: ignore

  docker:
    name: Container build and scan
    runs-on: ubuntu-latest
    needs: foundation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag campus-cuisines:pr .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: campus-cuisines:pr
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks CLI via Docker
        run: docker run --rm -v ${{ github.workspace }}:/path ghcr.io/gitleaks/gitleaks:latest detect --source=/path --verbose

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
