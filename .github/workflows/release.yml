name: Release to Cloud Run

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  prerequisites:
    name: Validate release prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate application and repository configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -f manage.py || { echo 'Release requires the future Django project (manage.py).'; exit 1; }
          test -n "$GCP_PROJECT_ID" || { echo 'Missing GCP_PROJECT_ID repository variable.'; exit 1; }
          test -n "$GCP_REGION" || { echo 'Missing GCP_REGION repository variable.'; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo 'Missing GCP_WORKLOAD_IDENTITY_PROVIDER repository variable.'; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo 'Missing GCP_SERVICE_ACCOUNT repository variable.'; exit 1; }
      - name: Verify configured release version
        run: |
          VERSION='${{ inputs.version || github.ref_name }}'
          case "$VERSION" in v[0-9]*) ;; *) echo 'Version must start with v followed by a number.'; exit 1;; esac

  deploy:
    name: Build, migrate, deploy, and smoke test
    needs: prerequisites
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: ruff format --check . && ruff check . && pyright && bandit -q -r . && pip-audit --local
      - run: pytest --cov --cov-report=xml:reports/coverage.xml
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build, scan, publish, migrate, and deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          echo 'Release commands are enabled only after the Django project and Cloud Run service name are defined.'
          exit 1
